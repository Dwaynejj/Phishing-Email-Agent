<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishShield</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h2>PhishShield</h2>
    <p class="hint">Open a Gmail message, then click Check Email.</p>
    <button id="checkEmail">Check Email</button>
    <p id="result">Result: <span>Waiting...</span></p>
    <div class="settings">
        <label for="apiUrl">API URL</label>
        <input id="apiUrl" type="text" value="http://127.0.0.1:5001" />
        <button id="saveApi" class="secondary">Save API</button>
    </div>
    <script src="popup.js"></script>
</body>
</html>
